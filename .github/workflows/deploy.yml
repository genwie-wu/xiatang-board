# 每次更新程式（推送到 main）就自動把網站、資料庫權限規則與伺服器程式上傳到 Firebase
name: 上傳到 Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 安裝伺服器程式套件
        run: npm ci --prefix functions
      - name: 部署網站、權限規則與伺服器程式
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::warning::尚未設定 FIREBASE_SERVICE_ACCOUNT 金鑰，略過上傳"; exit 0; fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set -o pipefail
          if ! npx --yes firebase-tools@15 deploy --only hosting,firestore:rules,functions --project xiatang-board --non-interactive --force 2>&1 | tee deploy.log; then
            # 把錯誤訊息變成標註，方便在 GitHub 上直接看到原因
            msg=$(sed -e "s/\x1b\[[0-9;]*m//g" deploy.log | grep -v "^\s*$" | tail -30 | sed -e "s/%/%25/g" | awk '{printf "%s%%0A", $0}'); echo "::error::$msg"
            rm -f "$RUNNER_TEMP/sa.json"; exit 1
          fi
          rm -f "$RUNNER_TEMP/sa.json"
